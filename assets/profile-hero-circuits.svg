<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
<title id="t">Wagner Arcieri — AI, automation and digital products</title>
<desc id="d">A dark editorial-style banner. On the left, Wagner Arcieri and his focus areas. On the right, orange circuit traces radiate from an IA nucleus, inspired by the profile picture, linking ideas, workflows and products.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#252424"/><stop offset="1" stop-color="#090909"/></linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFE4C7"/><stop offset="1" stop-color="#FF913B"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#FF913B" stop-opacity=".15"/><stop offset="1" stop-color="#FF913B" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#D1B9A6" opacity=".13"/></pattern>
</defs>
<rect width="1200" height="430" rx="26" fill="url(#bg)"/>
<rect x="640" y="0" width="560" height="430" fill="url(#dots)"/>
<circle cx="973" cy="210" r="250" fill="url(#halo)"/>
<path d="M65 66H144" stroke="#FF913B" stroke-width="3" stroke-linecap="round"/>
<text x="160" y="71" fill="#BEAAA0" font-size="15" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.1">EXPLORING WHAT'S POSSIBLE</text>
<text x="65" y="165" fill="#F8F4EE" font-size="68" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="-2">Wagner</text>
<text x="65" y="237" fill="#F8F4EE" font-size="68" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="-2">Arcieri<tspan fill="#FF913B">.</tspan></text>
<text x="66" y="293" fill="#FFB675" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.1">AI  /  AUTOMATION  /  DIGITAL PRODUCTS</text>
<text x="66" y="338" fill="#D1C4BA" font-size="19" font-family="Arial, Helvetica, sans-serif">From ideas to connected, useful experiences.</text>
<path d="M66 387H580" stroke="#4A3C35" stroke-width="1"/>
<text x="66" y="407" fill="#A8978D" font-size="13" font-family="Arial, Helvetica, sans-serif" letter-spacing="2">EXPLORE    ·    DESIGN    ·    ORCHESTRATE</text>
