<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
<title id="t">Wagner Arcieri — AI, automation and digital products</title>
<desc id="d">A dark editorial-style banner. On the left, Wagner Arcieri and his focus areas. On the right, a visual network connects ideas, AI, workflows and products.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17212B"/><stop offset="1" stop-color="#0B1119"/></linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B2F6E6"/><stop offset="1" stop-color="#55C9BE"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#58D7BF" stop-opacity=".15"/><stop offset="1" stop-color="#58D7BF" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#A2B8BE" opacity=".13"/></pattern>
</defs>
