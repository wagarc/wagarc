<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 197" role="img" aria-labelledby="t d">
<title id="t">My approach: explore, orchestrate, make it usable</title>
<desc id="d">Three spacious dark cards outlining the work: explore opportunities, orchestrate AI and automation, and make powerful systems accessible.</desc>
<defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#252424"/><stop offset="1" stop-color="#0A0909"/></linearGradient></defs>
<g font-family="Arial, Helvetica, sans-serif">
<rect width="382" height="197" rx="20" fill="url(#card)"/>
<rect x=".5" y=".5" width="381" height="196" rx="19.5" fill="none" stroke="#514037"/>
<text x="28" y="43" font-size="14" letter-spacing="2" fill="#FF913B">01  /  DISCOVER</text>
<circle cx="329" cy="35" r="15" fill="none" stroke="#FF913B" stroke-width="2"/>
<path d="M329 20V50M314 35H344" stroke="#FF913B" stroke-width="1.5"/>
<text x="28" y="96" font-size="27" font-weight="700" fill="#F8F4EE">Explore possibilities</text>
<text x="28" y="135" font-size="17" fill="#D1C4BA">Problems, opportunities</text>
<text x="28" y="161" font-size="17" fill="#D1C4BA">and product direction.</text>
<rect x="409" width="382" height="197" rx="20" fill="url(#card)"/>
<rect x="409.5" y=".5" width="381" height="196" rx="19.5" fill="none" stroke="#514037"/>
<text x="437" y="43" font-size="14" letter-spacing="2" fill="#FF913B">02  /  ORCHESTRATE</text>
<g fill="none" stroke="#FF913B" stroke-width="2"><circle cx="733" cy="23" r="7"/><circle cx="754" cy="48" r="7"/><circle cx="716" cy="51" r="7"/><path d="M733 30L718 44M739 29L751 41M723 51H747"/></g>
<text x="437" y="96" font-size="27" font-weight="700" fill="#F8F4EE">Connect the pieces</text>
<text x="437" y="135" font-size="17" fill="#D1C4BA">AI, agents, tools and</text>
<text x="437" y="161" font-size="17" fill="#D1C4BA">automated workflows.</text>
<rect x="818" width="382" height="197" rx="20" fill="url(#card)"/>
<rect x="818.5" y=".5" width="381" height="196" rx="19.5" fill="none" stroke="#514037"/>
<text x="846" y="43" font-size="14" letter-spacing="2" fill="#FF913B">03  /  EXPERIENCE</text>
<rect x="1127" y="21" width="34" height="28" rx="5" fill="none" stroke="#FF913B" stroke-width="2"/>
<path d="M1133 29H1154M1133 36H1145" stroke="#FF913B" stroke-width="2" stroke-linecap="round"/>
<text x="846" y="96" font-size="27" font-weight="700" fill="#F8F4EE">Make it intuitive</text>
<text x="846" y="135" font-size="17" fill="#D1C4BA">Useful, approachable</text>
<text x="846" y="161" font-size="17" fill="#D1C4BA">digital experiences.</text>
